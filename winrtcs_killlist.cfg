# WINRTCS_KILLLIST 1 - known-bad artifact registry, fleet-enforced by winrtcs_guard.cmd (HuntKiller)
# every guard cycle on every machine. Background and root causes: CASES.md.
#
# Format: type|value|note
#   match    - regex matched against process command lines, WMI consumer/filter content,
#              scheduled task names AND actions, Run/RunOnce value data
#              (ScreenConnect* and winrtcs* command lines are ALWAYS excluded from kills)
#   taskname - regex matched against scheduled task names only
#   file     - exact path, deleted
#   dir      - exact path, deleted recursively
#   allow    - regex of process/service binaries NEVER reported as kill-scene suspects
#              (shadow learning only, C19; does NOT affect kills)
#   rmm      - rmm|DisplayName|regex  - remote-access tooling signature for the RMM radar
#              (C21): matched against service names/display names/binary paths and process
#              names. DETECT + REPORT ONLY, never killed here. ScreenConnect is handled by
#              dedicated fingerprint logic (every instance fully detailed), do not add it.
#
# Rules for new entries: never match the sevrz keepers (f861c8140d453427 / 5f6010579852e507),
# never match WinRTCS itself, prefer the narrowest pattern that catches the artifact.
# Cite the case number from CASES.md in the note.

match|gryxa|C11/C12 - legacy gryxa-killer automation (scripts/tasks named *gryxa*)
match|wucache|C12 - legacy own-stack camouflage family
match|etlcache|C12 - legacy etl-era stack
match|ETLParser|C12 - EVITA SystemHealthMonitor/DiagnosticsService camo payload
match|NetTraceParser|C12 - EVITA WindowsDiagnostics camo payload
match|own_mon|C12 - legacy monitor
match|own_lib|C12 - legacy library
match|own_gryxa|C12 - legacy gryxa watcher/heal scripts
match|zerocool|C13 - interim brand era
match|36e506ff016b2151|C11 - anything targeting the gryxa fingerprint by name is definitionally hostile
match|SCWatchdog|C12/C33 - WMI that deletes/stops ScreenConnect (ServiceDelete/ServiceStop/Consumer family)
match|SystemHealthMonitor|C12/C33 - WMI timer/filter/consumer family (name-based; payload strings alone miss it)
match|BVTConsumer|C12/C33 - BVT CommandLine consumer -> wucache.vbs
match|BVTTrigger|C12/C33 - BVT event filter bound to BVTConsumer
match|BVTFilter|C12/C33 - BVT filter name variant (fleet purge: 70 hosts)
match|WucacheWatchdog|C12/C33 - WMI watchdog family (fleet purge: 13 hosts)
match|KernCap|C12/C33 - orphan KernCap binding leftover after consumer delete
match|SCCleanup|C33 - SC-KeepTwo-RemoveRest gist workdir/log (removes Gryxa + keeper 5f601057)
match|KeepTwo|C33 - SC-KeepTwo-RemoveRest.ps1 family
match|RemoveRest|C33 - SC-KeepTwo-RemoveRest.ps1 family
match|3d23696c4a9e2141|C33 - hostile keep-list FP from KeepTwo gist (not a sevrz keeper)
match|4d789b4bfb0e00cd84c1f83a4ca5317e|C33 - gist raw id for SC-KeepTwo-RemoveRest.ps1
taskname|^%[A-Z]$|C12 - EVITA: mangled %VAR task names from broken legacy installers
