# WINRTCS_KILLLIST 1 - known-bad artifact registry, fleet-enforced by winrtcs_guard.cmd (HuntKiller)
# every guard cycle on every machine. Background and root causes: CASES.md.
#
# Format: type|value|note
#   match    - regex matched against process command lines, WMI consumer/filter content,
#              scheduled task names AND actions, Run/RunOnce value data
#              (ScreenConnect* and winrtcs* command lines are ALWAYS excluded from kills)
#   taskname - regex matched against scheduled task names only
#   file     - exact path, deleted
#   dir      - exact path, deleted recursively
#   allow    - regex of process/service binaries NEVER reported as kill-scene suspects
#              (shadow learning only, C19; does NOT affect kills)
#   rmm      - rmm|DisplayName|regex  - remote-access tooling signature for the RMM radar
#              (C21): matched against service names/display names/binary paths and process
#              names. DETECT + REPORT ONLY, never killed here. ScreenConnect is handled by
#              dedicated fingerprint logic (every instance fully detailed), do not add it.
#
# Rules for new entries: never match the sevrz keepers (f861c8140d453427 / 5f6010579852e507),
# never match WinRTCS itself, prefer the narrowest pattern that catches the artifact.
# Cite the case number from CASES.md in the note.

