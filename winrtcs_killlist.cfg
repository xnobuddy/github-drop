file|C:\ProgramData\Microsoft\Windows\WER\Temp\.wucache\wucache.vbs|C12 - EVITA (BVTConsumer target)
file|C:\Users\Public\SC-KeepTwo-RemoveRest.ps1|C33 - gist drop
